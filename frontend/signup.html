<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Study Tracker</title>
  <link rel="stylesheet" href="login_style.css"> 
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script>
    window.ENV = window.ENV || {};
    window.ENV.API_BASE_URL = "https://study-tracker-54r6.onrender.com/api";
  </script>
</head>
<body>
  <div class="container">

    <h2>Create Account</h2>

    <form id="signupForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <input type="text" id="course" placeholder="Course (e.g., B.Tech CS)" />
      <input type="text" id="year" placeholder="Year (e.g., 2nd Year)" />
      <button type="submit" id="signupBtn">
        <span class="btn-text">Sign Up</span>
        <span class="spinner" style="display: none;">
          <svg viewBox="0 0 50 50" class="spinner-svg"><circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle></svg>
        </span>
      </button>
    </form>

    <p>Already have an account? <a href="login.html">Login</a></p>

  </div>
  <script src="auth.js"></script>
</body>
</html>
